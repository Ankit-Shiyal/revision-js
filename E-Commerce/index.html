<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-Commerce</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section>
    <div class="container">
      <nav class="navbar navbar-expand-lg bg-body-secondary">
        <div class="container">
          <a class="navbar-brand" href="#">Navbar</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav m-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <button class="btn btn-outline-primary" onclick="showModal()">cart</button>
              </li>

              <li class="nav-item ms-2">
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addProductModal">
                  Add Product
                </button>
              </li>

            </ul>
            <form class="d-flex" role="search">
              <input id="searchInput" class="form-control me-2" type="search" placeholder="Search">
              <button class="btn btn-outline-success" type="button" onclick="searchProduct()">Search</button>
            </form>
          </div>
        </div>
      </nav>
    </div>
  </section>


  <main>
    <div class="container">
      <div class="row" id="productlist"></div>
    </div>


    <div class="modal fade" id="cartItem-list" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Cart Items</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <table class="table text-center ">
              <thead>
                <tr>
                  <th>Product Image</th>
                  <th>Product price</th>
                  <th>Quantity</th>
                  <th>Price</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="cartData"></tbody>
            </table>
          </div>
          <div class="modal-footer">

            <h5 class="fw-bold" id="grand-total"></h5>


            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary">check out</button>
          </div>
        </div>
      </div>
    </div>

  </main>


  <div class="modal fade" id="addProductModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Add New Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <form id="productForm">

            <input type="text" id="pname" class="form-control mb-2" placeholder="Product Name" required>

            <input type="number" id="pprice" class="form-control mb-2" placeholder="Price" required>

            <input type="text" id="pimg" class="form-control mb-2" placeholder="Image URL" required>

            <button type="submit" class="btn btn-primary w-100">
              Add Product
            </button>

            <div class="modal-footer">

              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>

          </form>
        </div>

      </div>
    </div>
  </div>



  <div class="modal fade" id="updateProduct" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Update Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <form id="UpdateForm">

            <input type="text" id="updateName" class="form-control mb-2" placeholder="Product Name" required>

            <input type="number" id="updatePrice" class="form-control mb-2" placeholder="Price" required>

            <input type="text" id="updateImg" class="form-control mb-2" placeholder="Image URL" required>

            <button type="submit" class="btn btn-primary w-100">
              Add Product
            </button>

            <div class="modal-footer">

              <button type="submit" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>

          </form>
        </div>

      </div>
    </div>
  </div>




  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>

</html>
